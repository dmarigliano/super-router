name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Type-check, lint, test, and build
        run: bun run check

      - name: Smoke-test Node 20 entrypoints
        run: |
          node ./bin/super-router.js version
          node --input-type=module --eval 'const api = await import("./dist/index.js"); if (typeof api.SuperRouter !== "function") throw new Error("SuperRouter export is unavailable")'

      - name: Audit production dependencies
        run: bun audit --production

      - name: Validate published package contents
        run: npm pack --ignore-scripts --dry-run
