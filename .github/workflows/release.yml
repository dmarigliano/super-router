name: Release to npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Validate release target
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";

          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const expectedName = "@dmarigliano/super-router";
          const expectedTag = `v${pkg.version}`;

          if (process.env.RELEASE_REF_TYPE !== "tag") {
            throw new Error("Release workflow must run from a Git tag ref.");
          }
          if (process.env.RELEASE_TAG !== expectedTag) {
            throw new Error(
              `Tag ${process.env.RELEASE_TAG} does not match package version ${expectedTag}.`,
            );
          }
          if (pkg.name !== expectedName) {
            throw new Error(`Refusing to publish unexpected package ${pkg.name}.`);
          }
          if (pkg.publishConfig?.access !== "public") {
            throw new Error("publishConfig.access must be public.");
          }
          if (process.env.REPOSITORY_PRIVATE !== "false") {
            throw new Error(
              "npm provenance requires this public package to be built from a public repository.",
            );
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `version=${pkg.version}\n`);
          NODE

      - name: Install npm with Trusted Publishing support
        run: |
          npm install --global npm@11.5.1
          node --version
          npm --version
          npm config set registry https://registry.npmjs.org/

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Type-check, lint, test, evaluate, and build
        run: bun run check

      - name: Audit production dependencies
        run: bun audit --production

      - name: Pack the exact release artifact
        id: pack
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          TARBALL="$RUNNER_TEMP/dmarigliano-super-router-${PACKAGE_VERSION}.tgz"
          test -f "$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Publish with npm Trusted Publishing and provenance
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --provenance
